# =============================================================================
# Cowrie operator configuration
# =============================================================================
# Installs to:  <state>/etc/cowrie.cfg
#
# This file contains OVERRIDES ONLY. Cowrie 3.x loads its bundled
# cowrie.cfg.dist as a defaults layer first, so anything not mentioned here
# keeps its upstream default.
#
# -----------------------------------------------------------------------------
# DO NOT start from the output of `cowrie init`.
# -----------------------------------------------------------------------------
# `cowrie init` writes the ENTIRE 49 KB template to etc/cowrie.cfg. If you then
# append your own section (a natural thing to do), the file contains that
# section twice and Cowrie refuses to start with:
#
#     configparser.DuplicateSectionError: section 'ssh' already exists
#
# which surfaces through twistd as the entirely unhelpful:
#
#     twistd --umask=0022: Unknown command: cowrie
#
# Keep this file minimal. `<state>` is substituted with the real state
# directory by deploy/install.sh.
#
# Values marked GENERATED are also written to
# <state>/etc/profile.cfg by realism/build_profile.py, derived from
# realism/identity.yaml. They are repeated here so that this file is a
# complete, readable description of the deployment; if the two disagree,
# profile.cfg wins because it is included second.
# =============================================================================

[honeypot]
# --- identity (GENERATED from realism/identity.yaml) -------------------------
hostname = deploy-01
sensor_name = deploy-01

# --- logging -----------------------------------------------------------------
# UTC everywhere so that honeypot logs can be correlated with CloudTrail,
# VPC flow logs and the evidence store without timezone arithmetic.
timezone = UTC
log_path = <state>/var/log/cowrie
# `rotating` writes cowrie.log and rotates to cowrie.log-YYYY-MM-DD at
# midnight, in addition to the logrotate policy in ops/logrotate/cowrie.
logtype = rotating
# Full terminal transcript of every session. This is what makes session
# playback possible. See docs/07-session-playback.md.
ttylog = true
ttylog_path = <state>/var/lib/cowrie/tty

# --- state paths -------------------------------------------------------------
state_path = <state>/var/lib/cowrie
download_path = ${honeypot:state_path}/downloads
etc_path = <state>/etc
# OPERATOR FILE OVERRIDES. Commands fall back to the bundled defaults for any
# path not present here. Note this key is read from [honeypot], not [shell] -
# putting it under [shell] silently does nothing and the affected commands
# then answer "cannot execute binary file: Exec format error".
txtcmds_path = <state>/share/txtcmds

# --- session behaviour -------------------------------------------------------
# Idle timeout for a logged-in session, in seconds. 180 keeps a slow
# interactive visitor engaged while releasing resources from scanners that
# authenticate and then go quiet.
idle_timeout = 300
# A client that never authenticates is disconnected after this long.
authentication_timeout = 120

# --- emulated machine identity (GENERATED) -----------------------------------
# Pinned instead of Cowrie's random 1-90 day default so that /proc/uptime,
# `uptime`, `last`, the `ps` START column and every generated log timestamp
# describe the same boot event.
boot_offset = 1209600

# MANDATORY. If this is left unset, Cowrie derives the address shown by
# `ifconfig` and `netstat -rn` from the host's real outbound socket, so the
# honeypot advertises the address of the instance it is running on.
internet_facing_ip = 10.20.30.40
fake_addr = 10.20.30.40

# --- captured files ----------------------------------------------------------
# Cap on any single captured file. ops/prune_local.sh enforces the aggregate
# budget; this stops one enormous upload from filling the volume.
download_limit_size = 67108864

[ssh]
# --- listener ----------------------------------------------------------------
listen_endpoints = tcp:22:interface=0.0.0.0

# --- advertised identity (GENERATED) -----------------------------------------
# Must name the same OpenSSH release that `ssh -V` reports inside the emulated
# shell and that dpkg -l claims is installed. The profile build fails if the
# banner and the shell string disagree.
version = SSH-2.0-OpenSSH_9.2p1 Debian-2+deb12u3

# --- authentication ----------------------------------------------------------
# Credential policy lives in etc/userdb.txt. Deliberately NOT using
# auth_publickey_allow_any or auth_none_enabled: both would let any client in
# without presenting a credential, which removes the authentication telemetry
# this deployment exists to collect.
auth_publickey_allow_any = false
auth_none_enabled = false
auth_keyboard_interactive_enabled = false

# --- SFTP --------------------------------------------------------------------
# Required. File transfers over SFTP are one of the highest-value events the
# honeypot records, and every upload is quarantined rather than run.
sftp_enabled = true

# --- SSH forwarding ----------------------------------------------------------
# Cowrie accepts direct-tcpip channel requests and, by default, answers them
# inside the emulated protocol. It never proxies to a real server.
#
# forward_redirect and forward_tunnel are left at their defaults (false).
# Setting either would send a visitor's traffic to a real destination, which
# this deployment must never do: it would make the honeypot a proxy into
# networks it is meant to be isolated from.
forwarding = true
forward_redirect = false
forward_tunnel = false

[shell]
# --- emulated filesystem (GENERATED by realism/build_profile.py) -------------
filesystem = ${honeypot:state_path}/fs.pickle
processes = ${honeypot:state_path}/cmdoutput.json

# --- emulated platform (GENERATED) -------------------------------------------
ssh_version = OpenSSH_9.2p1 Debian-2+deb12u3, OpenSSL 3.0.13 30 Jan 2024
kernel_version = 6.1.0-21-amd64
kernel_build_string = #1 SMP PREEMPT_DYNAMIC Debian 6.1.90-1 (2024-05-03)
hardware_platform = x86_64
operating_system = GNU/Linux
arch = linux-x64-lsb

# --- input limits ------------------------------------------------------------
# These bound how much work one visitor can cause. They are Cowrie 3.x
# hardening options; lowering them trades realism for resilience.
max_input_size = 16384
parse_timeout_seconds = 10
gc_collect_threshold = 512
scp_max_files_per_session = 20

[welcome]
# Honeypot-only: no real host ever prints this. Keep it empty.
message = ""

[llm]
# =============================================================================
# LLM MODE IS DISABLED. DO NOT ENABLE WITHOUT READING docs/13-llm-mode-review.md
# =============================================================================
# When `backend = llm` is set, every command a visitor types is transmitted to
# a third-party model provider, and the model's output is returned to the
# visitor. That has three consequences this deployment treats as blockers:
#
#   1. Captured attacker input (commands, paths, usernames, sometimes
#      credentials typed into prompts) leaves your boundary for a commercial
#      service. Captured data is security evidence; docs/06 sets out why it is
#      treated as sensitive.
#   2. The provider is a third party you cannot audit, and the traffic reveals
#      that you operate a honeypot and roughly how much attention it attracts.
#   3. LLM output is non-deterministic, so it cannot be made internally
#      consistent with the profile in realism/identity.yaml. Inconsistency is
#      exactly what a careful operator looks for.
#
# The shell backend stays the default. See docs/13 for the review checklist
# that must be completed first, and for the containment requirements if it is
# ever enabled in a lab.
backend = shell
# api_key = <never put a real key in this file; use the unit's EnvironmentFile>
# host = https://api.openai.com

[output_jsonlog]
# Structured, one JSON object per line: the primary machine-readable record.
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
# ISO-8601 UTC, not epoch. Human-readable and unambiguous.
epoch_timestamp = false

[output_textlog]
# Human-readable companion log. Off by default because cowrie.log already
# carries the same events and one fewer file is one less thing to rotate.
enabled = false

# Every other output plugin stays enabled = false. Several of them (VirusTotal,
# GreyNoise, DShield, Slack, Telegram, Discord, AbuseIPDB) transmit captured
# data about a visitor to a third party by design. docs/06 explains why none of
# them are enabled here and what to consider before enabling any of them.
